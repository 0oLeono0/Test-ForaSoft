# Проверки из TDD §12.4 одним последовательным заданием: быстрые шаги идут первыми, чтобы
# падение линтера не ждало сборки и браузерных тестов. Пороги покрытия §11.7 проверяет сам
# vitest (vitest.config.js), отдельного шага для них не нужно.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый push в ту же ветку отменяет предыдущий прогон: E2E занимают раннер надолго.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Версия берётся из .nvmrc — одна и та же в CI и у разработчика.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Unit и компонентные тесты с порогами покрытия (TDD §11.7).
      - name: Unit tests with coverage
        run: npm run test:coverage

      # Интеграционные тесты сервера на настоящих сокетах (TDD §11.3).
      - name: Integration tests
        run: npm run test:integration

      # Prod-like сборка клиента (TDD §12.1). E2E собирают клиент заново в режиме test,
      # так что этот шаг нужен именно как проверка production-бандла.
      - name: Build
        run: npm run build

      # Браузеры Playwright лежат вне node_modules, поэтому кешируются отдельно и по версии
      # @playwright/test из package-lock.json: после обновления пакета кеш обновится сам.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Системные библиотеки живут вне кешируемого каталога: после попадания в кеш их
      # всё равно нужно доставить.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      # Трассы упавших тестов (playwright.config.js: trace retain-on-failure).
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
